[project]
name = "centerstage-local"
version = "0.2.0"
description = "Local, agent-friendly dance center analysis with buffered playback"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = [
  "fastapi==0.155.0",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "rtmlib==0.0.16",
  "trackers==2.6.1",
  "supervision==0.31.0",
  "onnxruntime==1.31.0",
  "av==19.0.1",
  "httpx==0.28.1",
  "rapidocr==3.10.0",
  "scenedetect==0.7.2",
]

[project.scripts]
centerstage = "centerstage.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["centerstage"]
exclude = [
  "*.bak", "*.backup", "centerstage/static/index_v2.html",
  "centerstage/async_pipeline.py", "centerstage/batch_inference.py",
  "centerstage/enhanced_scoring.py", "centerstage/video_processor_v2.py",
  "centerstage/face_recognition.py", "centerstage/member_identifier.py",
  "centerstage/agent_identifier.py", "centerstage/agent_namer.py",
  "centerstage/auto_namer.py", "centerstage/center_detector.py",
  "centerstage/config_manager.py", "centerstage/logging_monitor.py",
  "centerstage/智能识别API.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
